name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install workshop R packages
        run: Rscript R/install_packages.R
      - name: Check workshop setup
        run: Rscript R/check_setup.R
      - name: Validate skill metadata and attribution
        run: Rscript tools/validate_skills.R
